<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair Performance Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Hair performance check</h1>
    <p id="sub">Eight quick questions about your hair and scalp. Takes about a minute.</p>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><div id="bar"></div></div>
    <p id="count"></p>
    <h2 id="question"></h2>
    <div id="options"></div>
  </section>

  <section id="result" hidden>
    <div class="score"><span id="total">0</span><small>out of 100</small></div>
    <p id="verdict"></p>
    <div id="cats"></div>
    <h3>What to do next</h3>
    <ul id="tips"></ul>
    <button id="restart" type="button">Check again</button>
  </section>

  <footer>Self-assessment only. For hair loss or scalp problems that persist, see a dermatologist.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
